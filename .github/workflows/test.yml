name: test
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create test fixtures
        shell: bash
        run: |
          printf '#!/bin/sh\necho hello\n' > test-cli
          chmod +x test-cli
          printf 'icns' > test-icon.icns

      - name: Package macOS app
        id: package
        uses: ./
        with:
          binary: test-cli
          version: 2.3.4

      - name: Verify app bundle
        shell: bash
        env:
          APP_PATH: ${{ steps.package.outputs.app-path }}
        run: |
          set -euo pipefail
          test -d "$APP_PATH/Contents/MacOS"
          test -f "$APP_PATH/Contents/Info.plist"
          test -f "$APP_PATH/Contents/MacOS/test-cli"
          if [ "$RUNNER_OS" != Windows ]; then
            test -x "$APP_PATH/Contents/MacOS/test-cli"
          fi
          grep -q '<string>com.example.test-cli</string>' "$APP_PATH/Contents/Info.plist"
          grep -q '<string>2.3.4</string>' "$APP_PATH/Contents/Info.plist"
          if command -v plutil >/dev/null 2>&1; then
            plutil -lint "$APP_PATH/Contents/Info.plist"
          fi

      - name: Package macOS app with options
        id: package-options
        uses: ./
        with:
          binary: test-cli
          name: Custom App
          bundle-id: io.example.custom
          icon: test-icon.icns
          output: dist

      - name: Verify app bundle with options
        shell: bash
        env:
          APP_PATH: ${{ steps.package-options.outputs.app-path }}
        run: |
          set -euo pipefail
          test -f "$APP_PATH/Contents/MacOS/Custom App"
          test -f "$APP_PATH/Contents/Resources/test-icon.icns"
          grep -q '<string>io.example.custom</string>' "$APP_PATH/Contents/Info.plist"
          grep -q '<key>CFBundleIconFile</key>' "$APP_PATH/Contents/Info.plist"
          if command -v plutil >/dev/null 2>&1; then
            plutil -lint "$APP_PATH/Contents/Info.plist"
          fi

      - name: Package macOS app with missing binary
        id: missing_binary
        continue-on-error: true
        uses: ./
        with:
          binary: missing-binary

      - name: Expect failure when binary is missing
        shell: bash
        env:
          OUTCOME: ${{ steps.missing_binary.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != failure ]; then
            echo "expected the action to fail for a missing binary" >&2
            exit 1
          fi
