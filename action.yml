name: package-macos-app
description: 📦 Packages a prebuilt binary into a macOS app bundle with GitHub Actions.
author: remarkablemark

inputs:
  version:
    description: Version
    required: false
    default: 1.2.3

runs:
  using: composite
  steps:
    - name: Print version
      shell: bash
      run: |
        echo "version: $VERSION"
      env:
        VERSION: ${{ inputs.version }}

branding:
  icon: package
  color: orange
